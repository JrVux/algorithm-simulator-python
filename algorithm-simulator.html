<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2c3e50;--secondary:#3498db;--accent:#e74c3c;--success:#27ae60;--warning:#f39c12;--info:#9b59b6;--light:#ecf0f1;--dark:#1a252f;--text:#333;--code-bg:#1e1e1e}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--light);color:var(--text)}
body.dark-mode{background:#121212;color:#e0e0e0}
body.dark-mode .panel,body.dark-mode .sidebar,body.dark-mode .control-bar,body.dark-mode .visualization-area{background:#1e1e1e;border-color:#333}
body.dark-mode .group-title{background:#2a2a2a;color:#5dade2}
body.dark-mode .algorithm-btn{background:#2a2a2a;color:#ddd;border-color:#444}
body.dark-mode .algorithm-btn.active{background:#3498db}
header{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:.8rem 1.5rem;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.header-content{max-width:1800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
h1{font-size:1.5rem;font-weight:600}
.controls{display:flex;gap:.4rem;flex-wrap:wrap}
.control-btn{background:#fff;border:none;padding:.4rem .8rem;border-radius:4px;cursor:pointer;font-weight:500;font-size:.85rem;transition:all .15s}
.control-btn:hover{transform:scale(1.04)}
.control-btn:active{transform:scale(.96)}
.container{max-width:1800px;margin:.8rem auto;padding:0 .8rem}
.main-grid{display:grid;grid-template-columns:240px 1fr;gap:.8rem}
@media(max-width:1200px){.main-grid{grid-template-columns:200px 1fr}}
.sidebar{background:#fff;border-radius:8px;padding:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.1);height:fit-content}
.sidebar-title{font-size:1rem;font-weight:600;margin-bottom:.8rem;color:var(--primary);border-bottom:2px solid var(--secondary);padding-bottom:.4rem}
.algorithm-group{margin-bottom:.8rem}
.group-title{font-weight:600;color:var(--secondary);margin-bottom:.4rem;padding:.4rem .6rem;background:#e8f4f8;border-radius:4px;cursor:pointer;font-size:.9rem}
.group-content{display:none;margin-left:.4rem}
.group-content.active{display:block}
.algorithm-btn{display:block;width:100%;padding:.5rem .8rem;margin-bottom:.25rem;background:#fff;border:1px solid #ddd;border-left:3px solid var(--primary);border-radius:4px;cursor:pointer;text-align:left;font-size:.82rem;transition:all .2s}
.algorithm-btn:hover{background:#f5f5f5;border-left-color:var(--secondary)}
.algorithm-btn.active{background:var(--secondary);color:#fff;border-left-color:#fff}
.main-content{display:grid;grid-template-columns:2fr 1fr;gap:.8rem}
@media(max-width:1000px){.main-content{grid-template-columns:1fr}}
.visualization-area{background:#fff;border-radius:8px;padding:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.1);min-height:350px}
.visualization-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.visualization-title{font-size:1.1rem;font-weight:600;color:var(--primary)}
.viz-canvas{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8rem;background:var(--code-bg);border-radius:8px;overflow-x:auto}
.viz-container{width:100%;min-height:220px;display:flex;flex-direction:column;align-items:center}
.bar-container{display:flex;align-items:flex-end;gap:4px;margin:.6rem 0;min-height:140px}
.bar{width:36px;min-height:18px;background:var(--secondary);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 0;border-radius:4px 4px 0 0;transition:all .35s ease;position:relative}
.bar .bar-value{font-size:.82rem;font-weight:700;margin-bottom:3px;color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.5)}
.bar .bar-label{font-size:.7rem;color:#fff;opacity:.8}
.bar.comparing{background:var(--warning)}
.bar.swapping{background:var(--accent)}
.bar.sorted{background:var(--success)}
.bar.found{background:var(--info)}
.bar.dimmed{opacity:.25}
.bar.candidate{background:var(--info)}
.status-msg{margin-bottom:.6rem;padding:.6rem;border-radius:4px;font-weight:500;text-align:center;font-size:.9rem}
.status-msg.info{background:#e8f4f8;color:var(--primary)}
.status-msg.success{background:#d4edda;color:var(--success)}
.status-msg.error{background:#f8d7da;color:var(--accent)}
.panel{background:#fff;border-radius:8px;padding:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.panel-title{font-size:.95rem;font-weight:600;margin-bottom:.5rem;color:var(--primary);border-bottom:2px solid var(--secondary);padding-bottom:.3rem}
.code-panel{grid-row:1/-1}
.code-block{background:var(--code-bg);padding:.6rem;border-radius:8px;font-family:'Consolas','Courier New',monospace;overflow-x:auto;font-size:.82rem;max-height:520px;overflow-y:auto}
.code-block pre{margin:0;white-space:pre}
.code-line{display:block;padding:.2rem .5rem;color:#d4d4d4;white-space:pre}
.code-line.active{background:rgba(255,236,39,.25);border-left:3px solid #ffc107;color:#fff}
.code-line .ln{color:#858585;margin-right:1rem;user-select:none;display:inline-block;width:2rem}
.var-table{width:100%;border-collapse:collapse;font-size:.85rem}
.var-table th{text-align:left;padding:.3rem;color:var(--primary);border-bottom:1px solid #ddd}
.var-table td{padding:.3rem;font-family:'Consolas','Courier New',monospace}
.control-bar{background:#fff;border-radius:8px;padding:.6rem .8rem;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.6rem}
.control-group{display:flex;gap:.4rem;align-items:center}
.control-label{font-weight:500;color:var(--primary);font-size:.85rem}
.control-btn.green{background:var(--success);color:#fff}
.control-btn.red{background:var(--accent);color:#fff}
.control-btn.gray{background:var(--light);border:1px solid #ccc;color:var(--text)}
input[type=range]{width:100px}
.num-display{font-weight:700;color:var(--secondary);min-width:70px;text-align:center;font-size:.85rem}
.inline-input{padding:.3rem;border:1px solid #ccc;border-radius:4px;font-size:.85rem;width:100px}
.tree-container{width:100%;min-height:180px;overflow-x:auto;padding:.6rem 0}
.tree{display:flex;flex-direction:column;align-items:center;gap:2px}
.tree-row{display:flex;gap:30px;justify-content:center}
.tree-node{padding:.4rem .8rem;background:var(--secondary);color:#fff;border-radius:4px;font-size:.82rem;position:relative;border:2px solid transparent;transition:all .3s}
.tree-node.active{background:var(--accent);box-shadow:0 0 15px var(--accent)}
.tree-node.done{background:var(--success)}
.tree-node.returning{border-color:#ffc107}
.tree-line{width:2px;height:16px;background:#888;margin:0 auto}
.hanoi-area{display:flex;justify-content:space-around;align-items:flex-end;min-height:200px;margin:.6rem 0;gap:10px;width:100%}
.pole{width:100px;text-align:center}
.pole-stack{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;min-height:150px;position:relative}
.pole-rod{width:6px;height:150px;background:#888;border-radius:3px;position:absolute;bottom:0;z-index:0}
.pole-label{font-weight:600;color:var(--primary);font-size:.85rem;margin-top:.3rem}
.disk{height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;font-weight:700;z-index:1;transition:all .3s;box-shadow:1px 1px 3px rgba(0,0,0,.3)}
.stack-block{width:90px;height:34px;background:var(--secondary);display:flex;align-items:center;justify-content:center;border-radius:4px 4px 0 0;transition:all .3s;color:#fff;font-weight:700;font-size:.9rem}
.queue-row{display:flex;gap:15px;padding:15px;background:var(--code-bg);border-radius:8px;min-width:280px;flex-wrap:wrap;justify-content:center}
.queue-item{width:44px;height:44px;background:var(--secondary);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;transition:all .3s;position:relative;font-size:.85rem}
.queue-item .qidx{position:absolute;top:-18px;font-size:.7rem;color:var(--text)}
.queue-item.removed{transform:scale(.5);opacity:0}
.interact-area{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.5rem 0}
.interact-area input{width:70px;padding:.3rem;border:1px solid #ccc;border-radius:4px;font-size:.85rem}
</style>
</head>
<body>
<header>
<div class="header-content">

<script>
// ===== STATE =====
let algo = null, steps = [], curStep = -1, playing = false, interval = null;
let speed = 1000, arr = [];
let targetVal = 53; // default for search
let interactiveMode = false; // for stack/queue

// ===== ALGORITHM CODE TEMPLATES =====
const codeTpl = {
bubble:`1: def bubble_sort(arr):
2:     n = len(arr)
3:     for i in range(n - 1):
4:         for j in range(n - i - 1):
5:             if arr[j] > arr[j + 1]:
6:                 arr[j], arr[j + 1] = arr[j + 1], arr[j]
7:     return arr`,

selection:`1: def selection_sort(arr):
2:     n = len(arr)
3:     for i in range(n):
4:         min_idx = i
5:         for j in range(i + 1, n):
6:             if arr[j] < arr[min_idx]:
7:                 min_idx = j
8:         arr[i], arr[min_idx] = arr[min_idx], arr[i]
9:     return arr`,

insertion:`1: def insertion_sort(arr):
2:     for i in range(1, len(arr)):
3:         key = arr[i]
4:         j = i - 1
5:         while j >= 0 and arr[j] > key:
6:             arr[j + 1] = arr[j]
7:             j -= 1
8:         arr[j + 1] = key
9:     return arr`,

linear:`1: def linear_search(arr, target):
2:     for i in range(len(arr)):
3:         if arr[i] == target:
4:             return i
5:     return -1`,

binary:`1: def binary_search(arr, target):
2:     low = 0
3:     high = len(arr) - 1
4:     while low <= high:
5:         mid = (low + high) // 2
6:         if arr[mid] == target:
7:             return mid
8:         elif arr[mid] < target:
9:             low = mid + 1
10:        else:
11:            high = mid - 1
12:    return -1`,

factorial:`1: def factorial(n):
2:     if n <= 1:
3:         return 1
4:     return n * factorial(n - 1)`,

fibonacci:`1: def fibonacci(n):
2:     if n <= 0:
3:         return 0
4:     elif n == 1:
5:         return 1
6:     return fibonacci(n - 1) + fibonacci(n - 2)`,

hanoi:`1: def hanoi(n, from_rod, to_rod, aux_rod):
2:     if n == 1:
3:         print(f"Di chuyển đĩa 1 từ {from_rod} đến {to_rod}")
4:         return
5:     hanoi(n - 1, from_rod, aux_rod, to_rod)
6:     print(f"Di chuyển đĩa {n} từ {from_rod} đến {to_rod}")
7:     hanoi(n - 1, aux_rod, to_rod, from_rod)`,

stack:`1: class Stack:
2:     def __init__(self):
3:         self.items = []
4:     def push(self, item):
5:         self.items.append(item)
6:     def pop(self):
7:         return self.items.pop()`,

queue:`1: class Queue:
2:     def __init__(self):
3:         self.items = []
4:     def enqueue(self, item):
5:         self.items.append(item)
6:     def dequeue(self):
7:         return self.items.pop(0)`
};

// ===== UI HELPERS =====
function $(id){return document.getElementById(id)}
function tg(g){const e=$('g'+g);if(e)e.classList.toggle('active')}

function renderCode(code){
  const lines=code.split('\n');
  let html='<pre>';
  lines.forEach(l=>{
    const m=l.match(/^(\d+):\s*(.*)/);
    if(m){
      const n=m[1],c=m[2];
      html+=`<div class="code-line" data-line="${n}"><span class="ln">${n}</span>${c}</div>`;
    }else{
      html+=`<div class="code-line">${l}</div>`;
    }
  });
  html+='</pre>';
  return html;
}

function highlightCode(lines){
  document.querySelectorAll('.code-line').forEach(el=>el.classList.remove('active'));
  if(!lines||!lines.length)return;
  lines.forEach(n=>{
    const el=document.querySelector(`.code-line[data-line="${n}"]`);
    if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'center'})}
  });
}

// ===== STEP GENERATORS =====
function genBubble(a){
  const s=[];const arr=[...a];const n=arr.length;
  for(let i=0;i<n-1;i++){
    for(let j=0;j<n-i-1;j++){
      s.push({arr:[...arr],cmp:[j,j+1],vars:{i:i+1,j:j+1},code:[4,5],msg:`So sánh arr[${j}]=${arr[j]} với arr[${j+1}]=${arr[j+1]}`});
      if(arr[j]>arr[j+1]){
        [arr[j],arr[j+1]]=[arr[j+1],arr[j]];
        s.push({arr:[...arr],swp:[j,j+1],vars:{i:i+1,j:j+1},code:[6],msg:`Hoán đổi arr[${j}] và arr[${j+1}]`});
      }
    }
    s.push({arr:[...arr],sorted:arr.map((_,idx)=>idx>=n-i-1).map((v,i)=>v?i:-1).filter(v=>v>=0),vars:{i:i+1},code:[4],msg:`Bước ${i+1}: phần tử lớn nhất đã về cuối`});
  }
  s.push({arr:[...arr],sorted:arr.map((_,i)=>i),vars:{},code:[7],msg:`✅ Mảng đã được sắp xếp!`});
  return s;
}

function genSelection(a){
  const s=[];const arr=[...a];const n=arr.length;
  for(let i=0;i<n;i++){
    let mi=i;
    s.push({arr:[...arr],cmp:[i],vars:{i:i+1,min_idx:mi+1},code:[4],msg:`Bắt đầu vòng lặp i=${i}, min_idx=${mi}`});
    for(let j=i+1;j<n;j++){
      s.push({arr:[...arr],cmp:[mi,j],vars:{i:i+1,j:j+1,min_idx:mi+1},code:[5,6],msg:`So sánh arr[${j}]=${arr[j]} với arr[min_idx]=${arr[mi]}`});
      if(arr[j]<arr[mi]){mi=j;s.push({arr:[...arr],cmp:[mi],vars:{i:i+1,j:j+1,min_idx:mi+1},code:[7],msg:`Cập nhật min_idx=${mi}`});}
    }
    if(mi!==i){[arr[i],arr[mi]]=[arr[mi],arr[i]];s.push({arr:[...arr],swp:[i,mi],vars:{i:i+1,min_idx:mi+1},code:[8],msg:`Hoán đổi arr[${i}] và arr[${mi}]`});}
    s.push({arr:[...arr],sorted:arr.map((_,idx)=>idx<=i).map((v,i2)=>v?i2:-1).filter(v=>v>=0),vars:{i:i+1},code:[8],msg:`Phần tử nhỏ nhất đã ở vị trí ${i}`});
  }
  s.push({arr:[...arr],sorted:arr.map((_,i)=>i),vars:{},code:[9],msg:`✅ Sắp xếp hoàn tất!`});
  return s;
}

function genInsertion(a){
  const s=[];const arr=[...a];const n=arr.length;
  if(n<2){s.push({arr:[...arr],sorted:[0],vars:{},code:[9],msg:`Mảng có 1 phần tử`});return s;}
  s.push({arr:[...arr.slice(0,1)],vars:{i:1,key:arr[1]},code:[3],msg:`i=1, key=arr[1]=${arr[1]}`});
  for(let i=1;i<n;i++){
    let key=arr[i];let j=i-1;
    s.push({arr:[...arr],cmp:[i],vars:{i:i+1,key:key},code:[3],msg:`key=arr[${i}]=${key}, j=${j}`});
    while(j>=0&&arr[j]>key){
      s.push({arr:[...arr],cmp:[j,j+1],vars:{i:i+1,j:j+1,key:key},code:[5],msg:`arr[${j}]=${arr[j]} > ${key}, dịch chuyển`});
      arr[j+1]=arr[j];j--;
      s.push({arr:[...arr],vars:{i:i+1,j:j+1,key:key},code:[6,7],msg:`Đã dịch arr[${j+2}] ← arr[${j+1}], j--=${j}`});
    }
    arr[j+1]=key;
    s.push({arr:[...arr],vars:{i:i+1,j:j+1,key:key},code:[8],msg:`arr[${j+1}]=${key}`});
    s.push({arr:[...arr],sorted:arr.map((_,idx)=>idx<=i).map((v,i2)=>v?i2:-1).filter(v=>v>=0),vars:{i:i+1},code:[8],msg:`Phần tử 0..${i} đã sắp xếp`});
  }
  s.push({arr:[...arr],sorted:arr.map((_,i)=>i),vars:{},code:[9],msg:`✅ Sắp xếp hoàn tất!`});
  return s;
}

function genLinear(a,target){
  const s=[];const arr=[...a];let found=false;
  for(let i=0;i<arr.length;i++){
    s.push({arr:[...arr],cmp:[i],vars:{i:i+1,target:target},code:[2,3],msg:`Kiểm tra arr[${i}]=${arr[i]} với target=${target}`});
    if(arr[i]===target){found=true;s.push({arr:[...arr],found:[i],vars:{i:i+1,result:i},code:[4],msg:`✅ Tìm thấy ${target} tại vị trí ${i}!`});break;}
  }
  if(!found)s.push({arr:[...arr],vars:{result:-1},code:[5],msg:`❌ Không tìm thấy ${target} trong mảng`});
  return s;
}

function genBinary(a,target){
  const s=[];const arr=[...a].sort((x,y)=>x-y);
  let lo=0,hi=arr.length-1;let found=false;
  s.push({arr:[...arr],vars:{low:lo,high:hi,target:target},code:[2,3],msg:`Bắt đầu: low=${lo}, high=${hi}, target=${target}`});
  while(lo<=hi){
    let mid=Math.floor((lo+hi)/2);
    s.push({arr:[...arr],cmp:[mid],markers:{low:lo,mid:mid,high:hi},vars:{low:lo,high:hi,mid:mid,target:target},code:[4,5],msg:`mid=(${lo}+${hi})/2=${mid}, arr[mid]=${arr[mid]}`});
    if(arr[mid]===target){
      found=true;
      s.push({arr:[...arr],found:[mid],markers:{low:lo,mid:mid,high:hi},vars:{low:lo,high:hi,mid:mid,result:mid},code:[7],msg:`✅ Tìm thấy ${target} tại vị trí ${mid}!`});
      break;
    }else if(arr[mid]<target){
      s.push({arr:[...arr],dim:arr.map((_,i)=>i<=mid).map((v,i)=>v?i:-1).filter(v=>v>=0),markers:{low:lo,mid:mid,high:hi},vars:{low:lo,high:hi,mid:mid},code:[8,9],msg:`arr[mid]=${arr[mid]} < ${target}, loại nửa trái, low=${mid+1}`});
      lo=mid+1;
    }else{
      s.push({arr:[...arr],dim:arr.map((_,i)=>i>=mid).map((v,i)=>v?i:-1).filter(v=>v>=0),markers:{low:lo,mid:mid,high:hi},vars:{low:lo,high:hi,mid:mid},code:[10,11],msg:`arr[mid]=${arr[mid]} > ${target}, loại nửa phải, high=${mid-1}`});
      hi=mid-1;
    }
  }
  if(!found)s.push({arr:[...arr],vars:{result:-1},code:[12],msg:`❌ Không tìm thấy ${target} trong mảng`});
  return s;
}

function genFactorial(){
  const s=[];
  function gen(n,level,parent){
    const id=s.length;
    s.push({type:'rec',call:`factorial(${n})`,params:{n},level,parent,id,
      vars:{n},code:[1],msg:`Gọi factorial(${n})`,active:'start'});
    if(n<=1){
      s.push({type:'rec',call:`factorial(${n})`,params:{n},result:1,level,parent,id,
        vars:{n,result:1},code:[2,3],msg:`n=${n} ≤ 1 → return 1`,active:'return'});
    }else{
      s.push({type:'rec',call:`factorial(${n})`,params:{n},level,parent,id,
        vars:{n},code:[4],msg:`return ${n} * factorial(${n-1})`,active:'calc'});
      gen(n-1,level+1,id);
      const fact=(n)=>{
        let r=1;for(let i=2;i<=n;i++)r*=i;return r;
      };
      s.push({type:'rec',call:`factorial(${n})`,params:{n},result:fact(n),level,parent,id,
        vars:{n,result:fact(n)},code:[4],msg:`✅ factorial(${n}) = ${n} * factorial(${n-1}) = ${fact(n)}`,active:'return'});
    }
  }
  gen(6,0,-1);
  return s;
}

function genFibonacci(){
  const s=[];
  function fib(n){if(n<=0)return 0;if(n===1)return 1;return fib(n-1)+fib(n-2);}
  function gen(n,level,parent){
    const id=s.length;
    s.push({type:'rec',call:`fib(${n})`,params:{n},level,parent,id,
      vars:{n},code:[1],msg:`Gọi fibonacci(${n})`,active:'start'});
    if(n<=0){
      s.push({type:'rec',call:`fib(${n})`,params:{n},result:0,level,parent,id,
        vars:{n,result:0},code:[2,3],msg:`n=${n} ≤ 0 → return 0`,active:'return'});
    }else if(n===1){
      s.push({type:'rec',call:`fib(${n})`,params:{n},result:1,level,parent,id,
        vars:{n,result:1},code:[4,5],msg:`n=${n} == 1 → return 1`,active:'return'});
    }else{
      const f1=fib(n-1),f2=fib(n-2);
      s.push({type:'rec',call:`fib(${n})`,params:{n},level,parent,id,
        vars:{n,fib_n_1:`?`,fib_n_2:`?`},code:[6],msg:`return fib(${n-1}) + fib(${n-2})`,active:'calc'});
      gen(n-1,level+1,id);
      gen(n-2,level+1,id);
      s.push({type:'rec',call:`fib(${n})`,params:{n},result:f1+f2,level,parent,id,
        vars:{n,fib_n_1:f1,fib_n_2:f2,result:f1+f2},code:[6],msg:`✅ fib(${n}) = ${f1} + ${f2} = ${f1+f2}`,active:'return'});
    }
  }
  gen(6,0,-1);
  return s;
}

function genHanoi(n){
  const s=[];
  const rods=[[],[],[]];
  for(let i=n;i>=1;i--)rods[0].push(i);
  s.push({type:'hanoi',rods:rods.map(r=>[...r]),msg:`Bắt đầu: ${n} đĩa trên cọc A`});
  function hanoi(cnt,from,to,aux){
    if(cnt===1){
      const d=rods[from].pop();
      rods[to].push(d);
      s.push({type:'hanoi',rods:rods.map(r=>[...r]),move:{from,to,disk:d},
        msg:`Di chuyển đĩa ${d} từ ${String.fromCharCode(65+from)} sang ${String.fromCharCode(65+to)}`});
    }else{
      hanoi(cnt-1,from,aux,to);
      const d=rods[from].pop();
      rods[to].push(d);
      s.push({type:'hanoi',rods:rods.map(r=>[...r]),move:{from,to,disk:d},
        msg:`Di chuyển đĩa ${d} từ ${String.fromCharCode(65+from)} sang ${String.fromCharCode(65+to)}`});
      hanoi(cnt-1,aux,to,from);
    }
  }
  hanoi(n,0,2,1);
  s.push({type:'hanoi',rods:rods.map(r=>[...r]),msg:`✅ Hoàn thành! Tất cả đĩa đã sang cọc C`});
  return s;
}

function genStack(actions){
  const s=[];const st=[];
  actions.forEach(a=>{
    if(a.op==='push'){
      st.push(a.val);
      s.push({type:'stack',stack:[...st],op:'push',val:a.val,
        vars:{top:st.length-1,value:a.val},code:[4,5],msg:`Push(${a.val}) → stack: [${st.join(',')}]`});
    }else{
      if(st.length){const v=st.pop();
      s.push({type:'stack',stack:[...st],op:'pop',val:v,
        vars:{top:st.length-1,popped:v},code:[6,7],msg:`Pop() → lấy ${v}, stack còn: [${st.join(',')}]`});}
    }
  });
  return s;
}

function genQueue(actions){
  const s=[];const q=[];
  actions.forEach(a=>{
    if(a.op==='enqueue'){
      q.push(a.val);
      s.push({type:'queue',queue:[...q],op:'enqueue',val:a.val,
        vars:{rear:q.length-1,value:a.val},code:[4,5],msg:`Enqueue(${a.val}) → queue: [${q.join(',')}]`});
    }else{
      if(q.length){const v=q.shift();
      s.push({type:'queue',queue:[...q],op:'dequeue',val:v,
        vars:{front:0,dequeued:v},code:[6,7],msg:`Dequeue() → lấy ${v}, queue còn: [${q.join(',')}]`});}
    }
  });
  return s;
}

// ===== GENERATE STEPS FOR ALGO =====
function genSteps(){
  if(!algo)return;
  steps=[];curStep=-1;
  const title={bubble:'Bubble Sort',selection:'Selection Sort',insertion:'Insertion Sort',
    linear:'Linear Search',binary:'Binary Search',factorial:'Giai thừa',fibonacci:'Fibonacci',
    hanoi:'Tháp Hà Nội',stack:'Stack (Push/Pop)',queue:'Queue (Enqueue/Dequeue)'};
  $('vizTitle').textContent=title[algo]||algo;
  $('codeBlock').innerHTML=renderCode(codeTpl[algo]);
  interactiveMode=false;

  if(algo==='bubble')steps=genBubble(arr);
  else if(algo==='selection')steps=genSelection(arr);
  else if(algo==='insertion')steps=genInsertion(arr);
  else if(algo==='linear')steps=genLinear(arr,targetVal);
  else if(algo==='binary')steps=genBinary(arr,targetVal);
  else if(algo==='factorial')steps=genFactorial();
  else if(algo==='fibonacci')steps=genFibonacci();
  else if(algo==='hanoi')steps=genHanoi(4);
  else if(algo==='stack'){
    interactiveMode=true;
    const acts=[{op:'push',val:5},{op:'push',val:3},{op:'push',val:8},{op:'pop'},{op:'push',val:7},{op:'pop'},{op:'pop'}];
    steps=genStack(acts);
  }else if(algo==='queue'){
    interactiveMode=true;
    const acts=[{op:'enqueue',val:1},{op:'enqueue',val:2},{op:'enqueue',val:3},{op:'dequeue'},{op:'enqueue',val:4},{op:'dequeue'},{op:'dequeue'}];
    steps=genQueue(acts);
  }
  updateExtraControls();
  $('stepDisp').textContent=`0/${steps.length}`;
  setStep(0);
}

// ===== EXTRA CONTROLS =====
function updateExtraControls(){
  const ec=$('extraControls');const evc=$('extraVizControls');
  ec.innerHTML='';evc.innerHTML='';
  if(algo==='linear'||algo==='binary'){
    ec.innerHTML=`<span class="control-label">Target:</span>
      <input class="inline-input" type="number" id="targetInput" value="${targetVal}" style="width:70px">
      <button class="control-btn" onclick="updateTarget()">🔍 Tìm</button>`;
  }
  if(interactiveMode){
    if(algo==='stack'){
      ec.innerHTML=`<span class="control-label">Giá trị:</span>
        <input class="inline-input" type="number" id="stackVal" value="0" style="width:60px">
        <button class="control-btn green" onclick="stackPush()">Push</button>
        <button class="control-btn red" onclick="stackPop()">Pop</button>`;
    }
    if(algo==='queue'){
      ec.innerHTML=`<span class="control-label">Giá trị:</span>
        <input class="inline-input" type="number" id="queueVal" value="0" style="width:60px">
        <button class="control-btn green" onclick="queueEnq()">Enqueue</button>
        <button class="control-btn red" onclick="queueDeq()">Dequeue</button>`;
    }
  }
}

function updateTarget(){
  const inp=$('targetInput');if(!inp)return;
  targetVal=parseInt(inp.value)||0;
  genSteps();
}

function stackPush(){
  const inp=$('stackVal');if(!inp)return;
  const v=parseInt(inp.value)||0;
  const newSteps=genStack([{op:'push',val:v}]);
  steps=steps.concat(newSteps);
  steps.push({type:'stack',stack:steps[steps.length-1].stack,op:'push',val:v,
    vars:{top:steps[steps.length-1].stack.length-1,value:v},code:[4,5],msg:`Push(${v})`});
  curStep=steps.length-1;
  $('stepDisp').textContent=`${curStep+1}/${steps.length}`;
  setStep(curStep);
}

function stackPop(){
  const newSteps=genStack([{op:'pop'}]);
  steps=steps.concat(newSteps);
  curStep=steps.length-1;
  $('stepDisp').textContent=`${curStep+1}/${steps.length}`;
  setStep(curStep);
}

function queueEnq(){
  const inp=$('queueVal');if(!inp)return;
  const v=parseInt(inp.value)||0;
  steps=steps.concat(genQueue([{op:'enqueue',val:v}]));
  curStep=steps.length-1;
  $('stepDisp').textContent=`${curStep+1}/${steps.length}`;
  setStep(curStep);
}

function queueDeq(){
  steps=steps.concat(genQueue([{op:'dequeue'}]));
  curStep=steps.length-1;
  $('stepDisp').textContent=`${curStep+1}/${steps.length}`;
  setStep(curStep);
}

// ===== RENDER =====
function renderStep(s){
  const c=$('vizCanvas');
  if(!s){c.innerHTML='<span style="color:#888">Không có dữ liệu</span>';return;}
  if(s.type==='rec')renderRec(s,c);
  else if(s.type==='hanoi')renderHanoi(s,c);
  else if(s.type==='stack')renderStack(s,c);
  else if(s.type==='queue')renderQueue(s,c);
  else renderBars(s,c);
}

function renderBars(s,c){
  if(!s.arr||!s.arr.length){c.innerHTML='<p style="color:#888">Không có dữ liệu</p>';return;}
  const max=Math.max(...s.arr,1);
  let html='<div class="viz-container"><div class="bar-container">';
  s.arr.forEach((v,i)=>{
    let cls='bar';
    if(s.found&&s.found.includes(i))cls+=' found';
    else if(s.dim&&s.dim.includes(i))cls+=' dimmed';
    else if(s.swp&&s.swp.includes(i))cls+=' swapping';
    else if(s.cmp&&s.cmp.includes(i))cls+=' comparing';
    else if(s.sorted&&s.sorted.includes(i))cls+=' sorted';
    const h=Math.max(20,Math.min(250,v/max*180));
    let marker='';
    if(s.markers){
      if(s.markers.low===i)marker+=`<div style="color:#f39c12;font-size:.7rem;font-weight:700">▼low</div>`;
      if(s.markers.mid===i)marker+=`<div style="color:#e74c3c;font-size:.7rem;font-weight:700">▼mid</div>`;
      if(s.markers.high===i)marker+=`<div style="color:#9b59b6;font-size:.7rem;font-weight:700">▼high</div>`;
    }
    html+=`<div class="${cls}" style="height:${h}px"><div class="bar-value">${v}</div><div class="bar-label">[${i}]</div>${marker}</div>`;
  });
  html+='</div></div>';
  c.innerHTML=html;
}

function renderRec(s,c){
  const calls=steps.filter(st=>st.type==='rec').reduce((acc,st)=>{
    if(!acc.find(x=>x.id===st.id))acc.push(st);return acc;
  },[]);
  const activeId=s.id;
  // Build tree structure
  const tree={};
  calls.forEach(st=>{
    if(!tree[st.id])tree[st.id]=st;
  });
  // Only show up to current step
  const upTo=steps.indexOf(s);
  const shown=calls.filter(st=>steps.indexOf(st)<=upTo);
  // Render as flat indented list for simplicity
  let html='<div class="tree-container"><div class="tree">';
  shown.forEach(st=>{
    const pad=st.level*20;
    let cls='tree-node';
    if(st.active==='return')cls+=' done';
    else if(st.id===activeId)cls+=' active';
    let label=st.call;
    if(st.result!==undefined)label+=` = ${st.result}`;
    html+=`<div style="margin-left:${pad}px;display:flex;align-items:center;gap:4px">`;
    if(st.level>0)html+=`<div style="width:20px;height:2px;background:#888"></div>`;
    html+=`<div class="${cls}">${label}</div>`;
    if(st.active==='return')html+=`<span style="color:var(--success);font-size:.75rem">✓</span>`;
    else if(st.id===activeId&&st.active!=='return')html+=`<span style="color:var(--accent);font-size:.75rem">▶</span>`;
    html+=`</div>`;
  });
  html+='</div></div>';
  c.innerHTML=html;
  $('statusMsg').textContent=s.msg;
}

function renderHanoi(s,c){
  const labels=['A','B','C'];
  let html='<div class="hanoi-area">';
  s.rods.forEach((rod,ri)=>{
    html+=`<div class="pole"><div class="pole-stack"><div class="pole-rod"></div>`;
    rod.forEach((d,di)=>{
      const w=40+d*12;
      const colors=['#e74c3c','#3498db','#27ae60','#f39c12','#9b59b6','#1abc9c','#e67e22','#2ecc71'];
      html+=`<div class="disk" style="width:${w}px;background:${colors[(d-1)%colors.length]}">${d}</div>`;
    });
    html+=`</div><div class="pole-label">${labels[ri]}</div></div>`;
  });
  html+='</div>';
  if(s.move){
    const from=String.fromCharCode(65+s.move.from);
    const to=String.fromCharCode(65+s.move.to);
    html+=`<div style="color:var(--accent);font-weight:600;font-size:.9rem;margin-top:.5rem">➡️ Đĩa ${s.move.disk}: ${from} → ${to}</div>`;
  }
  c.innerHTML=html;
}

function renderStack(s,c){
  let html='<div class="viz-container"><div style="font-weight:600;color:var(--secondary);margin-bottom:.5rem">STACK</div>';
  if(!s.stack||!s.stack.length){
    html+='<div style="color:#888;padding:1rem">Stack rỗng</div>';
  }else{
    let tmp=[...s.stack];
    while(tmp.length){
      const v=tmp.pop();
      const isNew=s.op==='push'&&tmp.length===s.stack.length-2;
      html+=`<div class="stack-block" style="${isNew?'background:var(--success);transform:scale(1.05)':''}">${v}</div>`;
    }
  }
  html+='<div style="width:90px;height:2px;background:#888;margin-top:2px"></div>';
  html+='<div style="color:#888;font-size:.7rem;margin-top:2px">bottom</div></div>';
  c.innerHTML=html;
}

function renderQueue(s,c){
  let html='<div class="viz-container"><div style="font-weight:600;color:var(--secondary);margin-bottom:.5rem">QUEUE</div><div class="queue-row">';
  if(!s.queue||!s.queue.length){
    html+='<div style="color:#888">Queue rỗng</div>';
  }else{
    s.queue.forEach((v,i)=>{
      const isNew=s.op==='enqueue'&&i===s.queue.length-1;
      const isRemoved=s.op==='dequeue';
      html+=`<div class="queue-item ${isNew?'bar.comparing':''}" style="${isNew?'background:var(--success);transform:scale(1.1)':''}">
        <span class="qidx">${i}</span>${v}</div>`;
    });
  }
  html+='</div><div style="display:flex;gap:15px;margin-top:4px">';
  html+=`<span style="font-size:.75rem;color:#888">← front</span>`;
  html+=`<span style="font-size:.75rem;color:#888">rear →</span>`;
  html+='</div></div>';
  c.innerHTML=html;
}

// ===== STEP CONTROL =====
function setStep(n){
  if(n<0||n>=steps.length)return;
  curStep=n;
  const s=steps[n];
  $('stepDisp').textContent=`${n+1}/${steps.length}`;
  $('statusMsg').textContent=s.msg||'';
  $('statusMsg').className='status-msg info';
  if(s.vars)renderVars(s.vars);
  else renderVars({});
  if(s.code)highlightCode(s.code);
  else highlightCode([]);
  renderStep(s);
  $('bback').disabled=n<=0;
}

function renderVars(vars){
  const tb=$('varBody');
  if(!vars||!Object.keys(vars).length){
    tb.innerHTML='<tr><td colspan="2" style="text-align:center;color:#888">—</td></tr>';return;
  }
  tb.innerHTML=Object.entries(vars).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}

function stepF(){
  if(curStep<steps.length-1)setStep(curStep+1);
}
function stepB(){
  if(curStep>0)setStep(curStep-1);
}

function play(){
  if(playing||curStep>=steps.length-1){pause();return;}
  playing=true;$('bp').textContent='⏸ Pause';$('bpause').disabled=false;
  interval=setInterval(()=>{
    if(curStep<steps.length-1)stepF();
    else pause();
  },speed);
}

function pause(){
  playing=false;clearInterval(interval);
  $('bp').textContent='▶ Play';$('bpause').disabled=true;
}

function resetAll(){
  pause();curStep=-1;
  $('stepDisp').textContent='0/0';$('bp').textContent='▶ Play';
  $('bpause').disabled=true;$('bback').disabled=true;
  $('vizCanvas').innerHTML='<span style="color:#888">Sẵn sàng</span>';
  $('codeBlock').innerHTML='<pre><span style="color:#888">Chọn thuật toán</span></pre>';
  $('varBody').innerHTML='<tr><td colspan="2" style="text-align:center;color:#888">—</td></tr>';
  $('statusMsg').textContent='Đã reset';
}

// ===== ARRAY =====
function genRandom(n){
  arr=Array.from({length:n},()=>Math.floor(Math.random()*49)+1);
  $('statusMsg').textContent=`📊 Mảng ngẫu nhiên ${n} phần tử: [${arr.join(',')}]`;
  $('statusMsg').className='status-msg success';
  if(algo&&steps.length)resetAll();
}

function customArray(){
  const inp=prompt('Nhập mảng số, cách nhau bằng dấu phẩy (vd: 5,2,9,1,7)');
  if(!inp)return;
  const a=inp.split(',').map(x=>parseInt(x.trim())).filter(x=>!isNaN(x));
  if(!a.length){alert('Mảng không hợp lệ');return;}
  arr=a;
  $('statusMsg').textContent=`📝 Mảng: [${arr.join(',')}]`;
  $('statusMsg').className='status-msg success';
  if(algo&&steps.length)resetAll();
}

function updSpd(){
  speed=parseInt($('spd').value);
  $('spdVal').textContent=speed+'ms';
  if(playing){pause();play();}
}

function toggleTheme(){document.body.classList.toggle('dark-mode')}

// ===== SELECT ALGORITHM =====
function sel(a){
  algo=a;
  document.querySelectorAll('.algorithm-btn').forEach(b=>b.classList.remove('active'));
  if(event&&event.target)event.target.classList.add('active');
  genSteps();
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(playing)pause();else play();}
  else if(e.code==='ArrowRight')stepF();
  else if(e.code==='ArrowLeft')stepB();
  else if(e.code==='Home')setStep(0);
  else if(e.code==='End')setStep(steps.length-1);
});
</script>
